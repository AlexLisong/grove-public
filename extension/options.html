<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Grove Capture settings</title><link rel="stylesheet" href="style.css"></head><body class="options"><h1>Connect Grove Capture</h1><p>Use your Grove URL and a scoped token from Settings → API access. The token stays in this browser.</p><form id="settings"><label>Grove URL<input id="url" type="url" required placeholder="https://grove.example"></label><label>API token<input id="token" type="password" required autocomplete="off"></label><label>Workspace ID<input id="workspace" required></label><button>Connect securely</button></form><p id="status" role="status"></p><button id="disconnect" class="secondary">Disconnect this browser</button><p>Recommended scopes: workspace:read, workspace:write, files:write. Only the Grove server origin you choose receives permission. Page content is captured when you ask.</p><script src="options.js"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Save to Grove</title><link rel="stylesheet" href="style.css"></head><body><header><strong>◒ grove</strong><button id="settings" class="secondary">Settings</button></header><h1>A good idea belongs somewhere.</h1><form id="capture"><label>Title<input id="title" required></label><label>Notes or selected highlight<textarea id="content" rows="5"></textarea></label><label>Save to<select id="board"><option value="">Library</option></select></label><label>Tags<input id="tags" placeholder="research, inspiration"></label><button id="save">Save to Grove</button></form><p id="status" role="status"></p><button id="collection" class="secondary" hidden>Capture visible Instagram saved posts</button><p class="quiet">Capture only content you are entitled to save. Account passwords and site cookies stay on the source site.</p><script type="module" src="popup.js"></script></body></html>
